<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Graduation Cap -->
  <g transform="translate(10, 20)">
    <!-- Cap Top (Diamond) -->
    <path d="M256 64L64 160L256 256L448 160L256 64Z" fill="#1E293B" stroke="white" stroke-width="8" stroke-linejoin="round"/>
    <!-- Cap Bottom (V-shape) -->
    <path d="M110 185V240C110 300 256 340 256 340C256 340 402 300 402 240V185" fill="#1E293B" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tassel -->
    <path d="M448 160V220" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <circle cx="448" cy="235" r="10" fill="#FFC107" stroke="#B45309" stroke-width="2"/>
  </g>

  <!-- Wallet (Teal) -->
  <g transform="translate(0, 50)">
    <!-- Wallet Body -->
    <rect x="86" y="220" width="340" height="220" rx="40" fill="rgb(48,147,158)" stroke="white" stroke-width="4" />
    
    <!-- Wallet Flap/Edge Detail -->
    <path d="M86 260 H 426" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    
    <!-- Wallet Clasp -->
    <path d="M426 300H450C466.569 300 480 313.431 480 330V350C480 366.569 466.569 380 450 380H426V300Z" fill="#134E4A" stroke="white" stroke-width="2"/>
    <circle cx="453" cy="340" r="12" fill="#E2E8F0"/>

    <!-- Rising Graph (Yellow/Gold) -->
    <path d="M140 380 L 200 320 L 260 360 L 360 260" fill="none" stroke="#FFC107" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M320 260 L 360 260 L 360 300" fill="none" stroke="#FFC107" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Rupee Symbol -->
    <text x="220" y="400" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFC107">₹</text>
  </g>
</svg>
